<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CalmCampus</title>
  <meta name="description" content="CalmCampus helps students notice early signs and reach the right campus support. Your answers stay on your device.">
  <meta name="cc-university" content="default">
  <meta name="theme-color" content="#F5EAD8">
  <meta name="color-scheme" content="only light">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CalmCampus">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/caprasimo-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <header class="top" id="top"></header>
    <div id="demo-banner"></div>
    <main id="view" tabindex="-1"></main>
    <div class="dock" id="dock">
      <div id="actions" class="actions-bar"></div>
      <p class="disclaimer" id="disclaimer"></p>
      <nav id="nav" class="nav"></nav>
    </div>
  </div>
  <noscript><p style="padding:24px;font-family:sans-serif" lang="fr">CalmCampus a besoin de JavaScript pour fonctionner. Tes réponses ne quittent jamais ton appareil.</p><p style="padding:0 24px;font-family:sans-serif" lang="en">CalmCampus needs JavaScript to run. Your answers never leave your device.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
